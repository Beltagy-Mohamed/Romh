services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fazaa
      POSTGRES_PASSWORD: fazaa_dev_password # dev only — production uses secrets manager
      POSTGRES_DB: fazaa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazaa -d fazaa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    profiles: ["full"] # dev only: start with `docker compose --profile full up`
    environment:
      DATABASE_URL: postgres://fazaa_app:fazaa_app_dev@postgres:5432/fazaa
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
